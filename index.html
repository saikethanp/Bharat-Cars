<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bharat Cars • The Elite Automotive Vault</title>
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/logo.png" as="image" />
    
    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #050505;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
      }
      
      .loader-logo-container {
        position: relative;
        margin-bottom: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      
      .loader-logo {
        height: 100px;
        width: auto;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
      }
      
      .loader-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, rgba(200, 16, 46, 0.2) 0%, transparent 70%);
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        z-index: -1;
      }
      
      .loader-text {
        font-size: 1.1rem;
        letter-spacing: 2px;
        color: #cccccc;
        text-transform: uppercase;
        font-weight: 300;
        margin-bottom: 1.5rem;
      }
      
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #C8102E; /* Red-500 matching the brand */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.98); }
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Utility for fading out */
      .loader-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-logo-container">
        <div class="loader-glow"></div>
        <img src="/logo.png" alt="Bharat Cars Logo" class="loader-logo" />
      </div>
      <div class="loader-text">Preparing Luxury Experience...</div>
      <div class="loader-spinner"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
