<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Golden Gradients -->
    <linearGradient id="gold-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7E6319" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#5C4710" />
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9C7D21" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="bg-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151208" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <!-- Drop Shadow -->
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="10" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Deep Luxury Dark Background -->
  <rect width="100%" height="100%" fill="url(#bg-radial)" rx="40" />

  <!-- Abstract Luxury Emblem -->
  <g filter="url(#gold-shadow)" transform="translate(0, 10)">
    <!-- Outer Shield / Diamond Frame -->
    <path d="M 250,50 L 410,210 L 250,370 L 90,210 Z" 
          fill="none" 
          stroke="url(#gold-primary)" 
          stroke-width="1.5" 
          stroke-opacity="0.4" 
          stroke-dasharray="4 4" />
    
    <path d="M 250,65 L 395,210 L 250,355 L 105,210 Z" 
          fill="none" 
          stroke="url(#gold-primary)" 
          stroke-width="2" 
          stroke-opacity="0.75" />

    <!-- Outer Glow ring -->
    <circle cx="250" cy="210" r="110" fill="none" stroke="url(#gold-glow)" stroke-width="1" />

    <!-- Crown/Crest of Power (Top center of emblem) -->
    <path d="M 210,130 L 230,150 L 250,115 L 270,150 L 290,130 L 280,170 L 220,170 Z" 
          fill="url(#gold-primary)" />

    <!-- Bold Winged Accents (Heritage & Power) -->
    <!-- Left Wing -->
    <path d="M 120,210 C 120,210 180,180 230,200 C 200,215 170,220 135,225 Z" 
          fill="url(#gold-primary)" />
    <path d="M 130,230 C 130,230 180,210 220,225 C 195,235 170,240 142,242 Z" 
          fill="url(#gold-primary)" opacity="0.85" />
    <path d="M 145,250 C 145,250 185,235 215,248 C 195,255 175,258 155,260 Z" 
          fill="url(#gold-primary)" opacity="0.7" />

    <!-- Right Wing -->
    <path d="M 380,210 C 380,210 320,180 270,200 C 300,215 330,220 365,225 Z" 
          fill="url(#gold-primary)" />
    <path d="M 370,230 C 370,230 320,210 280,225 C 305,235 330,240 358,242 Z" 
          fill="url(#gold-primary)" opacity="0.85" />
    <path d="M 355,250 C 355,250 315,235 285,248 C 305,255 325,258 345,260 Z" 
          fill="url(#gold-primary)" opacity="0.7" />

    <!-- Central Symmetrical Diamond (Focus & Precision) -->
    <polygon points="250,175 275,210 250,245 225,210" fill="url(#gold-primary)" />

    <!-- Elegant Core Pillar -->
    <line x1="250" y1="175" x2="250" y2="300" stroke="url(#gold-primary)" stroke-width="3" />
    
    <!-- Sophisticated Swirls / Lower Crest Base -->
    <path d="M 200,280 C 230,300 270,300 300,280 C 285,310 215,310 200,280 Z" 
          fill="url(#gold-primary)" />

    <!-- Tiny Accent Stars -->
    <polygon points="175,150 177,155 182,155 178,158 179,163 175,160 171,163 172,158 168,155 173,155" fill="url(#gold-primary)" opacity="0.6" />
    <polygon points="325,150 327,155 332,155 328,158 329,163 325,160 321,163 322,158 318,155 323,155" fill="url(#gold-primary)" opacity="0.6" />
  </g>

  <!-- Exquisite Labeling Typography below the emblem -->
  <text x="250" y="420" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="24" 
        font-weight="500" 
        fill="url(#gold-primary)" 
        letter-spacing="8" 
        text-anchor="middle">BHARAT CARS</text>

  <text x="250" y="445" 
        font-family="'JetBrains Mono', monospace" 
        font-size="9" 
        font-weight="400" 
        fill="#9C7D21" 
        letter-spacing="4" 
        text-anchor="middle">THE ELITE AUTOMOTIVE VAULT</text>
</svg>
